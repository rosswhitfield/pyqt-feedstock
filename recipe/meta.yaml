{% set version = "6.11.0" %}
{% set qt_version = "6.11.3" %}
# PyQt6 uses Qt's private QMetaObjectBuilder API (and a bundled copy of its layout),
# which is not ABI stable across Qt patch releases (see #201), so qt6-main is pinned
# to the exact version built against.
{% set qt_main_spec = qt_version + ".*" %}
{% set sip_version = "6.15.3" %}
{% set pyqt6_sip_version = "13.13.0" %}
{% set pyqt_builder_version = "1.18.2" %}


package:
  name: pyqt6-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/P/PyQt{{ version[0] }}/pyqt{{ version[0] }}-{{ version }}.tar.gz
    sha256: 45dd60aa69976de1918b5ced6b4e7b6a25abd2a919ecef5fd5826ecc76718889
    folder: pyqt
    patches:
      # PyQt6 bundles its own copy of Qt's private QMetaMethodBuilder layout, which
      # gained a member in Qt 6.11.2 (#201).
      - 0001-QMetaMethodBuilder-Qt-6.11.2-layout.patch

build:
  number: 8
  skip:
    - true  # [not linux]
    - true  # [linux and ppc64le]

outputs:
  - name: pyqt6
    version: {{ version }}
    script: build-pyqt.sh  # [not win]
    script: bld-pyqt.bat  # [win]
    build:
      run_exports:
        - {{ pin_subpackage('pyqt6', max_pin='x.x') }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - jom                                      # [win]
        - python                                   # [build_platform != target_platform]
        - cross-python_{{ target_platform }}       # [build_platform != target_platform]
        - pyqt-builder {{ pyqt_builder_version }}  # [build_platform != target_platform]
        - sip {{ sip_version }}                    # [build_platform != target_platform]
        - qt6-main {{ qt_main_spec }}                # [build_platform != target_platform]
        - make
        - patchelf                                  # [linux]
        - libsystemd                                # [linux]
      host:
        - python
        - pip
        - setuptools
        - sip {{ sip_version }}                    # [build_platform == target_platform]
        - toml
        - pyqt-builder {{ pyqt_builder_version }}  # [build_platform == target_platform]
        - packaging
        - qt6-main {{ qt_main_spec }}
        - libvulkan-headers
        - libsystemd                             # [linux]
        - libgl-devel                            # [linux]
        - libegl-devel                           # [linux]
        - libopengl-devel                        # [linux]
        - xorg-xorgproto                         # [linux]
        - xcb-util                               # [linux]
        - xcb-util-wm                            # [linux]
        - xcb-util-keysyms                       # [linux]
        - xcb-util-image                         # [linux]
        - xcb-util-renderutil                    # [linux]
        - xorg-libx11                            # [linux]
        - xorg-libxext                           # [linux]
        - xorg-libxdamage                        # [linux]
        - xorg-libsm                             # [linux]
        - xorg-libice                            # [linux]
        - xorg-libxcomposite                     # [linux]
        - xorg-libxxf86vm                        # [linux]
        - xorg-xf86vidmodeproto                  # [linux]
      run:
        - python
        - pyqt6-sip {{ pyqt6_sip_version }}
        # Qt's run export allows newer patch releases, which break the private API (#201).
        - qt6-main {{ qt_main_spec }}
    test:
      files:
        - pyqt_test.py
        - test_plugin_load.py
        - test_slot_result.py
      imports:
        - PyQt6
        - PyQt6.sip
        - PyQt6.QtCore
        - PyQt6.QtGui
        - PyQt6.QtHelp
        - PyQt6.QtNetwork
        - PyQt6.QtOpenGL
        - PyQt6.QtPrintSupport
        - PyQt6.QtQml
        - PyQt6.QtQuick
        - PyQt6.QtQuickWidgets
        - PyQt6.QtSvg
        - PyQt6.QtSvgWidgets
        - PyQt6.QtTest
        - PyQt6.QtWebChannel
        - PyQt6.QtWebSockets
        - PyQt6.QtWidgets
        - PyQt6.QtXml
      commands:
        - python -c "from PyQt6.QtGui import QVulkanInstance, QWindow; assert hasattr(QWindow, 'setVulkanInstance')"  # [build_platform == target_platform]
        - QT_QPA_PLATFORM=offscreen python pyqt_test.py  # [linux and build_platform == target_platform]
        - pyuic6 --version  # [not win]
        - test -f "${PREFIX}/lib/qt6/plugins/designer/libpyqt6${SHLIB_EXT}"  # [unix]
        - if not exist "%PREFIX%\\Library\\plugins\\designer\\libpyqt6.dll" exit 1  # [win]
        - python test_plugin_load.py
        - python test_slot_result.py  # [build_platform == target_platform]

about:
  home: https://www.riverbankcomputing.com/software/pyqt/
  license: GPL-3.0-only
  license_family: GPL
  license_file: pyqt/LICENSE
  summary: Python bindings for the Qt cross platform application toolkit
  # The remaining entries in this section are optional, but recommended.
  description: |
    PyQt6 is a comprehensive set of Python bindings for Qt v6.
    It is implemented as more than 35 extension modules and enables Python
    to be used as an alternative application development language to C++ on
    all supported platforms including iOS and Android.
  doc_url: https://www.riverbankcomputing.com/static/Docs/PyQt6/
  dev_url: https://www.riverbankcomputing.com/mailman/listinfo/pyqt/

extra:
  recipe-maintainers:
    - andfoy
    - ccordoba12
    - mingwandroid
    - gillins
    - msarahan
    - ocefpaf
    - jschueller
    - pb01ka

  feedstock-name: pyqt
